# Minimal Supabase CLI config. Point the CLI at this package when running migrations:
#   supabase --workdir packages/db db reset
# Or symlink/copy migrations into a root supabase/ folder if preferred.

project_id = "passline"

[api]
enabled = true
port = 54321

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"
